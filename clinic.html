<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MealKind hand-out card</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--forest:#1F3D2B;--forest-2:#3A6B4A;--gold:#E8A33D;--gold-soft:#FBF1DE;--cream:#FDFBF7;--card:#FFFFFF;--ink:#2B2B28;--soft:#6C675E;--line:#EFE7D8;--good-bg:#E5EFE7;--good:#2B5038;--warn:#B5471F;
--display:"Cormorant Garamond",Georgia,serif;--body:"Jost","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:var(--cream);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
body{padding:0 16px 60px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);color:var(--forest);font-weight:600;line-height:1.1;text-wrap:balance}
h1{font-size:clamp(2.1rem,7vw,3.2rem)}
h2{font-size:1.8rem}
h3{font-size:1.35rem}
p{text-wrap:pretty}
a{color:var(--forest-2)}
.eyebrow{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:#B97A16;font-weight:600}
.muted{color:var(--soft)}.small{font-size:.88rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
button,.btn{font-family:var(--body);font-weight:600;font-size:1rem;border-radius:999px;padding:12px 22px;border:2px solid var(--forest);background:var(--forest);color:var(--cream);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.2;text-align:center}
button.ghost,.btn.ghost{background:transparent;color:var(--forest)}
button.gold,.btn.gold{background:var(--gold);border-color:var(--gold);color:#2A1E08}
button.sm,.btn.sm{padding:8px 14px;font-size:.9rem}
button.link{background:none;border:none;color:var(--forest-2);padding:0;text-decoration:underline;font-weight:500}
button.wide,.btn.wide{width:100%}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select,textarea{font:inherit;width:100%;padding:12px 14px;border:1.5px solid #E2D9C6;border-radius:12px;background:#fff;color:var(--ink)}
input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--forest);padding:0}
label{display:flex;flex-direction:column;gap:6px;font-size:.92rem;font-weight:500;color:var(--soft)}
label.check{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-weight:400;font-size:1rem}
.form{display:grid;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 0 6px;max-width:720px;margin:0 auto}
header.top .logo{font-family:var(--display);font-size:1.7rem;font-weight:700;color:var(--forest);text-decoration:none}
header.top .logo span{color:var(--gold)}
header.top nav{display:flex;gap:14px;align-items:center;font-size:.92rem}
header.top nav a{color:var(--forest);font-weight:500}
.tag{font-size:.75rem;background:var(--good-bg);color:var(--good);border-radius:999px;padding:4px 10px;font-weight:600;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-weight:500;font-size:.95rem;padding:9px 14px;border-radius:999px;border:1.5px solid #E2D9C6;background:#fff;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--forest);border-color:var(--forest);color:var(--cream)}
.note{background:var(--gold-soft);border-radius:14px;padding:12px 16px;font-size:.95rem}
.err{color:var(--warn);font-size:.92rem;min-height:1.2em}
.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--forest);color:var(--cream);padding:12px 18px;border-radius:999px;font-size:.95rem;z-index:10;max-width:calc(100% - 32px);text-align:center}
.ver{text-align:center;font-size:.72rem;color:#9A958B;margin-top:30px}
footer.foot{max-width:720px;margin:40px auto 0;border-top:1px solid var(--line);padding-top:18px;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;font-size:.85rem;color:var(--soft)}
footer.foot a{color:var(--soft)}
@media (max-width:520px){.two{grid-template-columns:1fr}}

.sheet{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:820px;margin:20px auto}
.hand{border:2px solid var(--forest);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px;background:#fff;break-inside:avoid}
.hand .logo{font-family:var(--display);font-size:2rem;font-weight:700;color:var(--forest)}
.hand .logo span{color:var(--gold)}
.hand h2{font-size:1.7rem}
.hand ol{padding-left:20px;display:flex;flex-direction:column;gap:4px}
.hand .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:auto}
.hand .url{font-weight:600;color:var(--forest);font-size:1.15rem}
.qr{width:96px;height:96px}
.bar{max-width:820px;margin:16px auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
@media print{.bar{display:none}body{padding:0;background:#fff}.sheet{margin:0;gap:10mm}}
@media (max-width:640px){.sheet{grid-template-columns:1fr}}
</style></head>
<body>
<div class="bar"><div><div class="eyebrow">For clinics and care teams</div><h1 style="font-size:2rem">Hand-out cards</h1><p class="small muted">Four cards per page. Print and cut, or leave at reception.</p></div><button onclick="print()">Print</button></div>
<div class="sheet" id="sheet"></div>
<script>
const card=`<div class="hand"><div class="logo">Meal<span>Kind</span></div>
<h2>Friends want to help. Let them cook what you can eat.</h2>
<ol><li>Go to mealkind.com and tell us the illness and allergies</li><li>Tick the recipes that fit your diet</li><li>Send friends one link. They pick a day and cook</li></ol>
<div class="foot"><div><div class="url">mealkind.com</div><div class="small muted">Free. About 5 minutes to set up.</div></div><div class="qr"></div></div></div>`;
document.getElementById("sheet").innerHTML=card.repeat(4);
try{document.querySelectorAll(".qr").forEach(el=>new QRCode(el,{text:"https://mealkind.com",width:96,height:96,colorDark:"#1F3D2B",colorLight:"#ffffff"}))}catch(e){}
</script>
</body></html>
